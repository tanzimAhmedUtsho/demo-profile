<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hire Tanzim Ahmed</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cloudflare.com" />
    <style>
      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }
      .contact-details {
        margin: 30px 0;
        text-align: left;
      }
      .contact-details div {
        margin-bottom: 15px;
        border-bottom: 1px solid var(--glass-border);
        padding-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="glass-card" style="max-width: 500px; width: 100%">
        <h1>Hire Me</h1>
        <p>Let's work together on your next project!</p>

        <div class="profile-info">
          <h2>Tanzim Ahmed</h2>
          <span>Web Developer & Data Analyst</span>
        </div>

        <div class="contact-details">
          <div class="item">
            <i class="fas fa-envelope"></i>
            <p>utshotanzim@gmail.com</p>
          </div>
          <div class="item">
            <i class="fas fa-phone-alt"></i>
            <p>+8801756467670</p>
          </div>
          <div class="item">
            <i class="fas fa-map-marker-alt"></i>
            <p>Agargaon, Dhaka</p>
          </div>
        </div>

        <div class="actions">
          <!-- Replace 'cv.pdf' with your actual CV file name -->
          <a href="cv.pdf" class="btn download-btn" download>
            <i class="fas fa-file-download"></i> Download CV
          </a>
          <a href="mailto:utshotanzim@gmail.com" class="btn email-btn">
            <i class="fas fa-paper-plane"></i> Send Email
          </a>
        </div>

        <a href="index.html" class="back-link">← Back to Portfolio</a>
      </div>
    </div>
  </body>
</html>
